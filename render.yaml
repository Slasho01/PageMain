# Blueprint de Render para el frontend (PageMain) como Static Site.
services:
  - type: web
    name: jarstore-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # URL pública de la API (SIN barra final, SIN /api). Ej: https://jarstore-api.onrender.com
      # Vite la incrusta en el build, así que debe estar definida ANTES de construir.
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: cualquier ruta cae en index.html (React Router hace el resto)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # --- Cabeceras de seguridad (Render static no hereda las de la API) ---
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com https://jarstore-api.onrender.com https://*.mlstatic.com; font-src 'self'; connect-src 'self' https://jarstore-api.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
